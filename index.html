<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B5C4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#14231f;--mut:#5d6f69;--line:#d9e1de;--pri:#0B5C4B;--pri-ink:#fff;--ok:#18794e;--okbg:#e3f4ea;--warn:#a05a00;--warnbg:#fff1d6;--bad:#b3261e;--badbg:#fde7e5;--soft:#e1efe9}
@media(prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#17211e;--ink:#e8f0ed;--mut:#9bb0a9;--line:#2a3a35;--pri:#2fb391;--pri-ink:#06211a;--ok:#5fd397;--okbg:#12301f;--warn:#f0b24b;--warnbg:#38290d;--bad:#ff8d85;--badbg:#3b1a18;--soft:#1b2c27}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:16px;line-height:1.6;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}
header.top h1{font-size:20px;margin:0}
.demo{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 10px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 12px;min-height:48px}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:var(--pri-ink);border:0;border-radius:14px;padding:12px 18px;min-height:48px;font-weight:700;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1}
.mut{color:var(--mut);font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.pill.in{background:var(--okbg);color:var(--ok)}
.pill.out{background:var(--soft);color:var(--mut)}
.pill.brk{background:var(--warnbg);color:var(--warn)}
.pill.none{background:var(--badbg);color:var(--bad)}
.msg{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.msg.err{background:var(--badbg);color:var(--bad)}
.msg.okm{background:var(--okbg);color:var(--ok)}
.msg.inf{background:var(--soft)}
.big{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 16px}
.clock{font-size:42px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
.bigbtn{width:100%;max-width:340px;min-height:84px;font-size:24px;border-radius:22px}
.bigbtn.outb{background:#b3541e;color:#fff}
.list .it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
a{color:var(--pri)}
nav.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;background:none;border:0;padding:10px 2px;min-height:56px;color:var(--mut);font-size:13px;cursor:pointer}
nav.tabs button.on{color:var(--pri);font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
.scroll{overflow-x:auto}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:3px;font-weight:800;direction:ltr;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}
.chk input{width:22px;min-height:22px;height:22px}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);max-width:min(520px,92vw);width:100%;padding:18px}
dialog::backdrop{background:#0008}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat>div{flex:1 1 70px;background:var(--soft);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
</style>

<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script>
'use strict';
/* ====================== إعدادات عامة ====================== */
const CFG = window.APP_CONFIG || {};
const REAL = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);
const TZ = CFG.TIMEZONE || 'Africa/Cairo';
const EMAIL_DOMAIN = 'staff.example.com';
const VER = 'النسخة 7';
const verTag = () => `<div class="mut" style="text-align:center;font-size:12px;margin:16px 0 0">${VER}</div>`;
// أنواع الإجازات اللي بتتخصم من الرصيد (تقدر تغيّرها من config.js بـ LEAVE_DEDUCT)
const DEDUCT = CFG.LEAVE_DEDUCT || ['regular', 'casual'];
const LEAVE = { regular: 'اعتيادية', casual: 'عارضة', company: 'طلب الشركة', sick: 'مرضية' };
const LSTATUS = { pending: ['قيد المراجعة', 'brk'], approved: ['مقبولة', 'in'], rejected: ['مرفوضة', 'none'] };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = ts => new Intl.DateTimeFormat('ar-EG', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(new Date(ts));
const fmtDate = ts => new Intl.DateTimeFormat('ar-EG', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' }).format(new Date(ts));
const dayKey = ts => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ts));
const monthKey = ts => dayKey(ts).slice(0, 7);
const fmtHours = ms => { const m = Math.round(ms / 60000); return Math.floor(m / 60) + ' س ' + String(m % 60).padStart(2, '0') + ' د'; };
const dayDiff = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
const addDays = (k, n) => new Date(Date.parse(k + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const fmtDay = k => new Intl.DateTimeFormat('ar-EG', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(k + 'T12:00:00Z'));
const fmtShort = k => new Intl.DateTimeFormat('ar-EG', { timeZone: 'UTC', day: 'numeric', month: 'short' }).format(new Date(k + 'T12:00:00Z'));
const nDays = n => Number(n).toLocaleString('ar-EG', { maximumFractionDigits: 1 });
const mapLink = (lat, lng) => `https://www.google.com/maps?q=${lat},${lng}`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(16).slice(2) + Date.now());
function distM(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180, dLat = (c - a) * r, dLng = (d - b) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
const toEmail = u => (u.includes('@') ? u : u.toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@' + EMAIL_DOMAIN);
const validUser = u => /^[a-zA-Z0-9._-]{3,30}$/.test(u) || /.+@.+\..+/.test(u);
const genCode = () => String(Math.floor(100000 + Math.random() * 900000));

const ERR = {
  AUTH: 'سجّل الدخول الأول.',
  BAD_CODE: 'الكود غلط أو اتستخدم قبل كده.',
  NOT_EMPLOYEE: 'حسابك مش مربوط بموظف مفعّل. كلّم الأدمن.',
  ALREADY_IN: 'إنت مسجّل حضور بالفعل. حدّث الصفحة وجرّب تاني.',
  NOT_IN: 'مفيش حضور مفتوح دلوقتي (ممكن يكون اتقفل تلقائيًا بعد 10 ساعات عمل). حدّث الصفحة وجرّب تاني.',
  NOT_ON_BREAK: 'إنت مش في استراحة دلوقتي.',
  NOT_SUPER: 'العملية دي للأدمن الكامل فقط.',
  USER_NOT_FOUND: 'مفيش حساب بالإيميل ده. اعمله الأول من Supabase ← Authentication ← Users (مع تفعيل Auto Confirm User).',
  IS_EMPLOYEE: 'الإيميل ده حساب موظف، ومينفعش يبقى أدمن.',
  SELF: 'مينفعش تسحب صلاحية نفسك.',
  BAD_NAME: 'اكتب اسم الموظف (حرفين على الأقل).',
  GROUP_LOCKED: 'تم تسجيل حضورك جماعيًا النهارده، فالحضور الفردي مقفول لباقي اليوم. المدير هو اللي يسجّل حضورك.',
  NOT_MANAGER: 'الصلاحية دي لمديري المواقع اللي حددهم الأدمن.',
  NO_MEMBERS: 'اختار موظف واحد على الأقل.',
  LEAVE_OVERLAP: 'فيه إجازة تانية (معلّقة أو مقبولة) بتتقاطع مع الأيام دي.',
  BAD_DATES: 'التواريخ مش صحيحة. تاريخ النهاية لازم يكون بعد أو يساوي البداية.',
  TOO_OLD: 'مينفعش تطلب إجازة لتاريخ أقدم من 30 يوم.',
  TOO_LONG: 'أقصى مدة للطلب الواحد 60 يوم.',
  NOT_ADMIN: 'العملية دي للأدمن فقط.',
  NOT_FOUND: 'الطلب مش موجود أو اتغيّرت حالته. حدّث الصفحة.',
  ADDRESS_REQUIRED: 'اكتب عنوان الموقع (3 حروف على الأقل).',
  BAD_LOCATION: 'الموقع اللي اتقرا مش صالح. جرّب تاني.',
  LOW_ACCURACY: 'دقة الموقع ضعيفة. اطلع مكان مفتوح أو شغّل GPS بدقة عالية وجرّب تاني.',
  'Invalid login credentials': 'اسم المستخدم أو كلمة السر غلط.',
  'User already registered': 'اسم المستخدم ده موجود. اختار اسم تاني.',
  'Email not confirmed': 'لازم تعطّل Confirm email من إعدادات Supabase (راجع دليل الإعداد).'
};
function errText(e) {
  const m = (e && (e.message || e.msg || e.error_description || e.error)) || String(e || '');
  const o = /OUTSIDE:(\d+|\?)/.exec(m);
  if (o) return o[1] === '?' ? 'إنت برة نطاق أي فرع متاح ليك.' : `إنت برة نطاق الفرع. أقرب فرع متاح بعيد عنك حوالي ${Number(o[1]).toLocaleString('ar-EG')} متر.`;
  for (const k in ERR) if (m.includes(k)) return ERR[k];
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'مفيش اتصال بالإنترنت. جرّب تاني.';
  return m || 'حصل خطأ غير متوقع.';
}

/* ====================== الطبقة الحقيقية (Supabase عبر REST) ====================== */
function realApi() {
  const KEY = 'att.sess';
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { }
  const save = s => { sess = s; try { s ? localStorage.setItem(KEY, JSON.stringify(s)) : localStorage.removeItem(KEY); } catch (e) { } };
  const base = CFG.SUPABASE_URL.replace(/\/$/, '');
  const setSess = j => save({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000 - 30000, user: j.user });

  async function raw(path, opt = {}, authed = true) {
    const h = { apikey: CFG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json', ...(opt.headers || {}) };
    if (authed) {
      if (sess && Date.now() > sess.expires_at && sess.refresh_token) await refresh();
      h.Authorization = 'Bearer ' + (sess ? sess.access_token : CFG.SUPABASE_ANON_KEY);
    } else h.Authorization = 'Bearer ' + CFG.SUPABASE_ANON_KEY;
    const r = await fetch(base + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined });
    const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { j = { message: t }; }
    if (!r.ok) throw j || { message: r.statusText };
    return j;
  }
  async function refresh() {
    try { const j = await raw('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: sess.refresh_token } }, false); setSess(j); }
    catch (e) { save(null); throw e; }
  }
  const rest = (p, o) => raw('/rest/v1/' + p, o);
  let lastAC = 0;
  const autoClose = async () => { if (Date.now() - lastAC < 30000) return; lastAC = Date.now(); try { await raw('/rest/v1/rpc/auto_close_all', { method: 'POST', body: {} }); } catch (e) { } };
  const rpc = (n, b, authed = true) => raw('/rest/v1/rpc/' + n, { method: 'POST', body: b || {} }, authed);

  return {
    mode: 'real',
    hasSession: () => !!sess,
    async me() {
      if (!sess) return null;
      const u = sess.user.id;
      const a = await rest('admins?select=user_id,is_super&user_id=eq.' + u);
      if (a.length) return { role: 'admin', name: 'الأدمن', is_super: a[0].is_super };
      const e = await rest('employees?select=*&user_id=eq.' + u);
      if (e.length) return { role: 'employee', emp: e[0], name: e[0].full_name };
      return { role: 'none' };
    },
    async signIn(user, pw) { setSess(await raw('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: toEmail(user), password: pw } }, false)); },
    async codeValid(code) { return !!(await rpc('code_valid', { p_code: code }, false)); },
    async signUp(code, user, pw) {
      if (!(await this.codeValid(code))) throw { message: 'BAD_CODE' };
      const j = await raw('/auth/v1/signup', { method: 'POST', body: { email: toEmail(user), password: pw } }, false);
      if (!j.access_token) throw { message: 'Email not confirmed' };
      setSess(j);
      try { await rpc('claim_employee', { p_code: code }); } catch (e) { save(null); throw e; }
    },
    async claim(code) { await rpc('claim_employee', { p_code: code }); },
    signOut() { save(null); },
    async checkIn(kind, pos, address, note) { return rpc('check_in', { p_kind: kind, p_lat: pos.lat, p_lng: pos.lng, p_accuracy: pos.acc, p_address: address || '', p_note: note || '' }); },
    async myHistory(empId) { await autoClose(); return rest('attendance?select=*&employee_id=eq.' + empId + '&order=at.desc&limit=200'); },
    async employees() { return rest('employees?select=*&order=created_at'); },
    addEmployee: (name, balance) => rpc('add_employee', { p_name: name, p_balance: balance || 0 }),
    listAdmins: () => rpc('list_admins'),
    grantAdmin: (email, sup) => rpc('grant_admin', { p_email: email, p_super: !!sup }),
    setAdminScope: (uid, ids) => rpc('set_admin_scope', { p_user: uid, p_emps: ids }),
    revokeAdmin: uid => rpc('revoke_admin', { p_user: uid }),
    updEmployee: (id, patch) => rest('employees?id=eq.' + id, { method: 'PATCH', body: patch }),
    delEmployee: id => rest('employees?id=eq.' + id, { method: 'DELETE' }),
    async newCode(id) { const c = genCode(); await rest('employees?id=eq.' + id, { method: 'PATCH', body: { join_code: c, user_id: null } }); return c; },
    team: () => rpc('team_status'),
    async groupCheck(kind, ids, pos, address, note) { return rpc('group_check', { p_kind: kind, p_members: ids, p_lat: pos.lat, p_lng: pos.lng, p_accuracy: pos.acc, p_address: address, p_note: note || '' }); },
    teamLinks: () => rest('manager_team?select=*'),
    setTeam: (mid, ids) => rpc('set_manager_team', { p_manager: mid, p_members: ids }),
    leaves: () => rest('leave_requests?select=*&order=from_date.desc&limit=3000'),
    requestLeave: (kind, from, to, reason) => rpc('request_leave', { p_kind: kind, p_from: from, p_to: to, p_reason: reason || '' }),
    cancelLeave: id => rpc('cancel_leave', { p_id: id }),
    decideLeave: (id, status, days, note) => rpc('decide_leave', { p_id: id, p_status: status, p_days: days, p_note: note || '' }),
    addLeave: (emp, kind, from, to, days, note) => rpc('admin_add_leave', { p_emp: emp, p_kind: kind, p_from: from, p_to: to, p_days: days || 0, p_note: note || '' }),
    delLeave: id => rpc('delete_leave', { p_id: id }),
    async attendance(fromIso, toIso) {
      await autoClose();
      return rest(`attendance?select=*&at=gte.${encodeURIComponent(fromIso)}&at=lt.${encodeURIComponent(toIso)}&order=at.desc&limit=5000`);
    }
  };
}

/* ====================== الطبقة التجريبية (على الجهاز) ====================== */
function mockApi() {
  const KEY = 'att.mock';
  let db;
  try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { }
  if (!db) {
    const e1 = uid(), e2 = uid();
    db = {
      employees: [{ id: e1, user_id: null, full_name: 'أحمد محمد', join_code: '111111', active: true, leave_balance: 21, leave_from: new Date().getFullYear() + '-01-01' },
      { id: e2, user_id: null, full_name: 'سارة علي', join_code: '222222', active: true, leave_balance: 21, leave_from: new Date().getFullYear() + '-01-01' }], leaves: [],
      attendance: [], users: { admin: { pw: 'admin', role: 'admin' } }, session: null
    };
  }
  db.team = db.team || []; db.leaves = db.leaves || []; db.employees.forEach(e => { if (e.leave_balance == null) { e.leave_balance = 21; e.leave_from = new Date().getFullYear() + '-01-01'; } });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { } };
  const cur = () => db.users[db.session];
  const myEmp = () => { const u = cur(); return u && u.empId ? db.employees.find(e => e.id === u.empId && e.active) : null; };
  const lastOf = id => db.attendance.filter(a => a.employee_id === id).sort((a, b) => b.at.localeCompare(a.at))[0];
  const err = m => { throw { message: m }; };
  const isAdm = () => cur() && cur().role === 'admin';
  const okEmp = id => isAdm() && (cur().super !== false || (cur().scope || []).includes(id));
  const needOk = id => { if (!okEmp(id)) err('NOT_ADMIN'); };
  function autoClose() {
    const now = Date.now(), MAX = 10 * 3600e3;
    db.employees.forEach(e => {
      const recs = db.attendance.filter(a => a.employee_id === e.id).sort((a, b) => a.at.localeCompare(b.at));
      const last = recs[recs.length - 1]; if (!last || !(last.kind === 'in' || last.kind === 'break_end')) return;
      let si = 0; recs.forEach((r, i) => { if (r.kind === 'in') si = i; });
      let worked = 0, resume = null;
      for (const r of recs.slice(si)) { const t = Date.parse(r.at);
        if (r.kind === 'in') resume = t; else if (r.kind === 'break_start') { if (resume != null) { worked += t - resume; resume = null; } }
        else if (r.kind === 'break_end') resume = t; else if (r.kind === 'out') { resume = null; worked = 0; } }
      if (resume != null && worked + (now - resume) >= MAX)
        db.attendance.push({ id: uid(), employee_id: e.id, kind: 'out', at: new Date(resume + (MAX - worked)).toISOString(), lat: last.lat, lng: last.lng, accuracy_m: last.accuracy_m, address: last.address, note: 'انصراف تلقائي بعد 10 ساعات عمل (بدون تسجيل من الموظف)', auto: true, recorded_by: null, recorded_by_name: '' });
    });
    save();
  }
  return {
    mode: 'mock',
    hasSession: () => !!db.session,
    async me() {
      const u = cur(); if (!u) return null;
      if (u.role === 'admin') return { role: 'admin', name: 'الأدمن', is_super: u.super !== false };
      const e = myEmp(); return e ? { role: 'employee', emp: e, name: e.full_name } : { role: 'none' };
    },
    async signIn(user, pw) { const k = user.toLowerCase(); if (!db.users[k] || db.users[k].pw !== pw) err('Invalid login credentials'); db.session = k; save(); },
    async codeValid(code) { return db.employees.some(e => e.join_code === code && !e.user_id && e.active); },
    async signUp(code, user, pw) {
      if (!(await this.codeValid(code))) err('BAD_CODE');

/* ---------- أدوات الحسابات ---------- */
const KIND = { in: ['حضور', 'in'], out: ['انصراف', 'out'], break_start: ['بدء استراحة', 'brk'], break_end: ['نهاية استراحة', 'brk'] };
const stateOf = last => !last ? 'out' : (last.kind === 'in' || last.kind === 'break_end') ? 'in' : last.kind === 'break_start' ? 'break' : 'out';
// recsAsc: تسجيلات موظف واحد مرتبة من الأقدم. nowMs: لو متحدد، الفترة المفتوحة بتتحسب لحد دلوقتي.
function calc(recsAsc, nowMs) {
  let work = 0, brk = 0, st = null, bs = null;
  for (const r of recsAsc) {
    const t = Date.parse(r.at);
    if (r.kind === 'in') { if (st == null && bs == null) st = t; }
    else if (r.kind === 'break_start') { if (st != null) { work += t - st; st = null; bs = t; } }
    else if (r.kind === 'break_end') { if (bs != null) { brk += t - bs; bs = null; st = t; } }
    else if (r.kind === 'out') { if (st != null) { work += t - st; st = null; } else if (bs != null) { brk += t - bs; bs = null; } }
  }
  if (nowMs) { if (st != null) work += nowMs - st; if (bs != null) brk += nowMs - bs; }
  return { work, brk, open: st != null || bs != null };
}

/* ---------- شاشة الموظف ---------- */
function getPosition() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej({ message: 'جهازك أو متصفحك مش بيدعم تحديد الموقع.' });
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      e => rej({ message: e.code === 1 ? 'لازم تسمح للتطبيق بالوصول للموقع من إعدادات المتصفح، وبعدين جرّب تاني.' : e.code === 3 ? 'استغرق تحديد الموقع وقتًا طويلًا. اطلع مكان مفتوح وجرّب تاني.' : 'مقدرناش نحدد موقعك. شغّل GPS وجرّب تاني.' }),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

async function punch(kind) {
  const addrEl = $('#addr'), noteEl = $('#note');
  const address = addrEl ? addrEl.value.trim() : '', note = noteEl ? noteEl.value.trim() : '';
  S.data.addr = address; S.data.note = note;
  if ((kind === 'in' || kind === 'out') && address.length < 3) { setMsg('err', ERR.ADDRESS_REQUIRED); render(); const a = $('#addr'); if (a) a.focus(); return; }
  S.busy = true; setMsg(); render();
  try {
    const pos = await getPosition();
    if (pos.acc > 300) throw { message: 'LOW_ACCURACY' };
    await api.checkIn(kind, pos, address, note);

function balanceOf(emp, leaves) {
  const mine = leaves.filter(l => l.employee_id === emp.id && l.from_date >= (emp.leave_from || '0000-00-00'));
  const sum = f => mine.filter(f).reduce((a, l) => a + Number(l.days), 0);
  const byKind = {}; Object.keys(LEAVE).forEach(k => byKind[k] = sum(l => l.status === 'approved' && l.kind === k));
  const used = sum(l => l.status === 'approved' && DEDUCT.includes(l.kind));
  const pending = sum(l => l.status === 'pending' && DEDUCT.includes(l.kind));
  const initial = Number(emp.leave_balance || 0);
  return { initial, used, pending, remaining: initial - used, byKind };
}

/* ---------- الأدمن: التقارير ---------- */
const PTYPES = { day: 'يومي', week: 'أسبوعي', month: 'شهري', year: 'سنوي' };
function periodOf(type, ref) {
  if (type === 'day') return [ref, ref];
  if (type === 'week') { const dow = new Date(ref + 'T00:00:00Z').getUTCDay(); const st = addDays(ref, -((dow + 1) % 7)); return [st, addDays(st, 6)]; }   // الأسبوع يبدأ السبت
  const y = +ref.slice(0, 4), m = +ref.slice(5, 7);
  if (type === 'month') return [ref.slice(0, 7) + '-01', ref.slice(0, 7) + '-' + String(new Date(Date.UTC(y, m, 0)).getUTCDate()).padStart(2, '0')];
  return [y + '-01-01', y + '-12-31'];
}
function shiftRef(type, ref, dir) {
  if (type === 'day') return addDays(ref, dir);
  if (type === 'week') return addDays(ref, 7 * dir);
  const y = +ref.slice(0, 4), m = +ref.slice(5, 7) - 1;
  const d = type === 'month' ? new Date(Date.UTC(y, m + dir, 1)) : new Date(Date.UTC(y + dir, 0, 1));
  return d.toISOString().slice(0, 10);
}
const dayLeave = (empId, key, leaves) => leaves.find(l => l.employee_id === empId && l.status === 'approved' && l.from_date <= key && l.to_date >= key);

async function paneReports() {
  const type = S.data.rtype || 'month', ref = S.data.rref || dayKey(Date.now()), who = S.data.who || '';
  const [from, to] = periodOf(type, ref);
  const [emps, leaves, recsAll] = await Promise.all([api.employees(), api.leaves(), api.attendance(addDays(from, -1) + 'T00:00:00Z', addDays(to, 2) + 'T00:00:00Z')]);
  const recs = recsAll.filter(r => { const k = dayKey(r.at); return k >= from && k <= to; });
  const list = emps.filter(e => (!who || e.id === who) && (e.active || recs.some(r => r.employee_id === e.id)));
  const rows = list.map(e => {
    const mine = recs.filter(r => r.employee_id === e.id).slice().reverse();
    const c = calc(mine);
    const lv = {}; let lvTot = 0;
    leaves.filter(l => l.employee_id === e.id && l.status === 'approved' && l.to_date >= from && l.from_date <= to).forEach(l => {
      const ov = dayDiff(l.from_date > from ? l.from_date : from, l.to_date < to ? l.to_date : to) + 1, span = dayDiff(l.from_date, l.to_date) + 1;
      const d = Number(l.days) * ov / span; lv[l.kind] = (lv[l.kind] || 0) + d; lvTot += d;
    });
    return { e, c, days: new Set(mine.filter(r => r.kind === 'in').map(r => dayKey(r.at))).size, sites: mine.filter(r => r.kind === 'in').length, lv, lvTot };
  }).sort((a, b) => a.e.full_name.localeCompare(b.e.full_name, 'ar'));
  const T = rows.reduce((a, r) => ({ w: a.w + r.c.work, b: a.b + r.c.brk, d: a.d + r.days, l: a.l + r.lvTot }), { w: 0, b: 0, d: 0, l: 0 });
  const title = type === 'day' ? fmtDay(from) : type === 'year' ? from.slice(0, 4) : `${fmtDay(from)} ← ${fmtDay(to)}`;
  const kcols = Object.keys(LEAVE);
  S.data.csv = rows.map(r => [r.e.full_name, (r.c.work / 3600000).toFixed(2), (r.c.brk / 3600000).toFixed(2), r.days, r.sites, ...kcols.map(k => (r.lv[k] || 0).toFixed(1)), r.lvTot.toFixed(1)]);
  S.data.csvHead = ['الموظف', 'ساعات العمل', 'ساعات الراحة', 'أيام الحضور', 'عدد المواقع', ...kcols.map(k => 'إجازة ' + LEAVE[k]), 'إجمالي الإجازات'];
  S.data.csvName = `report-${type}-${from}`;
  // تفاصيل يومية لموظف واحد
  let detail = '';
  if (who && type !== 'day' && dayDiff(from, to) < 370) {
    const e = emps.find(x => x.id === who), mine = recs.filter(r => r.employee_id === who);
    const trs = []; for (let k = from; k <= to; k = addDays(k, 1)) {
      const rs = mine.filter(r => dayKey(r.at) === k).slice().reverse(), lvv = dayLeave(who, k, leaves);
      if (!rs.length && !lvv) continue; const c = calc(rs);
      trs.push(`<tr><td>${fmtDay(k)}</td><td>${nDays((c.work / 3600000).toFixed(2))}</td><td>${nDays((c.brk / 3600000).toFixed(2))}</td><td>${rs.filter(r => r.kind === 'in').length}</td><td>${lvv ? LEAVE[lvv.kind] : ''}</td></tr>`);
    }
    detail = `<div class="card"><h2>تفاصيل ${esc(e ? e.full_name : '')} يومًا بيوم</h2><div class="scroll"><table><thead><tr><th>اليوم</th><th>ساعات العمل</th><th>راحة (س)</th><th>مواقع</th><th>إجازة</th></tr></thead><tbody>${trs.join('') || '<tr><td colspan="5" class="mut">لا توجد بيانات.</td></tr>'}</tbody></table></div></div>`;
  }
  $('#pane').innerHTML = `<div class="card"><div class="grid2">
    <div><label for="rt">نوع التقرير</label><select id="rt">${Object.keys(PTYPES).map(k => `<option value="${k}" ${k === type ? 'selected' : ''}>${PTYPES[k]}</option>`).join('')}</select></div>
    <div><label for="rr">التاريخ</label><input id="rr" type="date" value="${ref}"></div></div>
    <label for="fw">الموظف</label><select id="fw"><option value="">كل الموظفين</option>${emps.map(e => `<option value="${e.id}" ${e.id === who ? 'selected' : ''}>${esc(e.full_name)}</option>`).join('')}</select>
    <div class="row sp" style="margin-top:10px"><div class="row"><button class="btn sec sm" data-act="rprev">السابق</button><button class="btn sec sm" data-act="rnext">التالي</button><button class="btn sec sm" data-act="rtoday">اليوم</button></div><button class="btn sec sm" data-act="csv">CSV</button></div></div>
  <div class="card"><h2 style="margin-bottom:4px">تقرير ${PTYPES[type]}</h2><div class="mut">${title}</div>
    <div class="stat" style="margin-top:10px"><div><b>${fmtHours(T.w)}</b>ساعات العمل</div><div><b>${fmtHours(T.b)}</b>الراحة</div><div><b>${nDays(T.l)}</b>أيام إجازات</div></div></div>
  <div class="card"><div class="scroll"><table><thead><tr><th>الموظف</th><th>ساعات العمل</th><th>الراحة</th><th>أيام الحضور</th><th>المواقع</th>${kcols.map(k => `<th>${LEAVE[k]}</th>`).join('')}<th>إجمالي الإجازات</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td>${esc(r.e.full_name)}${r.c.open ? ' <span class="mut">*</span>' : ''}</td><td><b>${fmtHours(r.c.work)}</b></td><td>${fmtHours(r.c.brk)}</td><td>${nDays(r.days)}</td><td>${nDays(r.sites)}</td>${kcols.map(k => `<td>${r.lv[k] ? nDays(r.lv[k]) : '—'}</td>`).join('')}<td><b>${r.lvTot ? nDays(r.lvTot) : '—'}</b></td></tr>`).join('') || '<tr><td colspan="10" class="mut">لا توجد بيانات.</td></tr>'}
  <tr><td><b>الإجمالي</b></td><td><b>${fmtHours(T.w)}</b></td><td>${fmtHours(T.b)}</td><td>${nDays(T.d)}</td><td></td>${kcols.map(() => '<td></td>').join('')}<td><b>${nDays(T.l)}</b></td></tr>
  </tbody></table></div><div class="mut" style="margin-top:8px">* فيه فترة حضور مفتوحة (من غير انصراف) مش محسوبة. وقت التنقل بين انصراف وحضور مش محسوب ساعات عمل.</div></div>${detail}`;
}

const dmsg = (t, ty = 'err') => { const m = $('#dmsg'); if (m) m.innerHTML = t ? `<div class="msg ${ty}">${esc(t)}</div>` : ''; };
const closeDlg = () => { const d = $('#dlg'); if (d) d.close(); };

document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
  try {
    if (a === 'mode') { S.authMode = v; setMsg(); renderAuth(); }
    else if (a === 'logout') { api.signOut(); S.me = null; S.tab = 'today'; S.etab = 'home'; S.data = {}; setMsg(); render(); }
    else if (a === 'punch') await punch(t.dataset.kind);
    else if (a === 'gmode') { S.data.gmode = v; setMsg(); renderEmpTeam(); }
    else if (a === 'gall') { const bs = [...document.querySelectorAll('#teamForm label[data-name]')].filter(l => l.style.display !== 'none').map(l => l.querySelector('input[name=gm]')).filter(i => i && !i.disabled); const all = bs.every(b => b.checked); bs.forEach(b => b.checked = !all); }
    else if (a === 'etab') { S.etab = v; setMsg(); render(); }
    else if (a === 'lvCancel') { if (confirm('إلغاء طلب الإجازة؟')) { await api.cancelLeave(id); setMsg('okm', 'تم إلغاء الطلب.'); render(); } }
    else if (a === 'lvAdd') addLeaveDlg();
    else if (a === 'lvDecide') decideDlg(id);
    else if (a === 'lvApprove' || a === 'lvReject') {
      const f = $('#decForm'), days = parseFloat($('#dd').value);
      if (!(days > 0)) return dmsg('عدد الأيام لازم يكون أكبر من صفر.');
      await api.decideLeave(f.dataset.id, a === 'lvApprove' ? 'approved' : 'rejected', days, $('#dn').value); await refreshAdmin();
    }
    else if (a === 'lvDel') { if (confirm('حذف القرار نهائيًا؟ لو كانت مقبولة هيرجع الرصيد.')) { await api.delLeave(id); await renderAdmin(); } }
    else if (a === 'rprev' || a === 'rnext') { const ty = S.data.rtype || 'month', r = S.data.rref || dayKey(Date.now()); S.data.rref = shiftRef(ty, r, a === 'rnext' ? 1 : -1); renderAdmin(); }
    else if (a === 'rtoday') { S.data.rref = dayKey(Date.now()); renderAdmin(); }
    else if (a === 'tab') { S.tab = v; setMsg(); renderAdmin(); }
    else if (a === 'refresh') renderAdmin();
    else if (a === 'close') closeDlg();
    else if (a === 'empEdit') editEmp(id);
    else if (a === 'adAdd') adminDlg('');
    else if (a === 'adEdit') adminDlg(id);
    else if (a === 'adRevoke') { if (confirm('سحب صلاحية الأدمن من الحساب ده؟')) { await api.revokeAdmin(id); await refreshAdmin(); } }
    else if (a === 'empDel') { if (confirm('حذف الموظف وكل تسجيلاته نهائيًا؟ لو عايز توقفه بس، شيل علامة «نشط».')) { await api.delEmployee(id); await refreshAdmin(); } }
    else if (a === 'empCode') { const c = await api.newCode(id); dmsg('الكود الجديد: ' + c + ' (الحساب القديم اتفك ارتباطه)', 'okm'); }
    else if (a === 'csv') {
      const rows = [S.data.csvHead || [], ...(S.data.csv || [])];
      const csv = '\ufeff' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');

      const l = document.createElement('a'); l.href = url; l.download = (S.data.csvName || 'export') + '.csv'; l.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
  } catch (e) { S.busy = false; dmsg(errText(e)); if (!$('#dmsg')) { setMsg('err', errText(e)); render(); } }
});

      setMsg('okm', 'تم إرسال الطلب، وهيوصل للأدمن.'); render();
    } else if (f.id === 'addLeaveForm') {
      await api.addLeave($('#ae').value, $('#ak').value, $('#af').value, $('#at').value, parseFloat($('#ad').value) || 0, $('#an').value);
      await refreshAdmin();
    } else if (f.id === 'decForm') {
      /* بيتم من الأزرار */
    } else if (f.id === 'emForm') {
      await api.updEmployee(f.dataset.id, { full_name: $('#emn').value.trim(), active: $('#ema').checked, leave_balance: Math.max(0, parseFloat($('#emb').value) || 0), leave_from: $('#emf').value, is_manager: $('#emm').checked });
      await api.setTeam(f.dataset.id, $('#emm').checked ? [...f.querySelectorAll('input[name=tm]:checked')].map(i => i.value) : []);
      await refreshAdmin();
    }
  } catch (e) {
    S.busy = false;
    if ($('#dlg')) dmsg(errText(e)); else { setMsg('err', errText(e)); render(); }
  }
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
boot();
</script>
</body>
</html>
